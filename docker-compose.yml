services:
  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: always

  backend:
    image: python:3.10-slim
    working_dir: /app
    environment:
      - HTTP_PROXY=http://10.130.10.254:3128
      - HTTPS_PROXY=http://10.130.10.254:3128
    volumes:
      - ./backend:/app
      - ./templates:/app/templates
      - ./uploads:/app/uploads
    command: sh -c "pip install -r requirements.txt && python app.py"
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: paynet_db
    volumes:
      - paynet_db_data:/var/lib/mysql
    restart: always

volumes:
  paynet_db_data:
